[workspace]
resolver = "2"
members = ["crates/common", "crates/ingest", "crates/detector", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
common = { path = "crates/common" }

anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# Smaller artifact, faster link — the deploy bridge only carries the binary.
strip = true
lto = "thin"
codegen-units = 4
