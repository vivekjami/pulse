# ARCHITECTURE.md §7. One file describes all services.
#
# The monorepo lives in the `api` service, so `api` is a SELF-deploy and its
# deployFiles must be [.] — a narrower pattern would delete the source tree.
# Per the Zerops deploy contract that changes only its start path:
#   deployFiles: target/release/~api + start: ./api   (cross-deploy form)
#   deployFiles: [.]                + start: ./target/release/api
# The other three are CROSS-deploys from `api` and use §7's binary-only form
# verbatim: the tilde strips the leading dirs so the binary lands at /var/www/.

zerops:
  - setup: ingest
    build:
      base: rust@stable
      os: ubuntu
      buildCommands:
        - cargo build --release -p ingest
      deployFiles: [target/release/~ingest]
    run: # no port; pure worker
      os: ubuntu
      envVariables:
        VALKEY_URL: ${cache_connectionString}
        STREAM_URL: https://stream.wikimedia.org/v2/stream/recentchange
        RUST_LOG: info
      start: ./ingest

  - setup: detector
    build:
      base: rust@stable
      os: ubuntu
      buildCommands:
        - cargo build --release -p detector
      deployFiles: [target/release/~detector]
    run:
      os: ubuntu
      # redis-tools is for operating the detector (inspecting windows, resetting
      # baselines during a tuning pass). prepareCommands, not an ad-hoc install:
      # a deploy replaces the container, so ad-hoc packages vanish.
      prepareCommands:
        - sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools
      envVariables:
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_dbName}
        VALKEY_URL: ${cache_connectionString}
        RUST_LOG: info
        # NOTE: the §4 gate constants (PULSE_K1, PULSE_EPSILON, …) are deliberately
        # NOT declared here. A key baked into run.envVariables is owned by this
        # file and cannot be overridden at service scope, so declaring them would
        # make every tuning change a ~9-minute Rust rebuild — the opposite of
        # PLAN.md's "tunable without rebuild". The code carries the §4 defaults;
        # override any of them with `zerops_env set serviceHostname=detector`,
        # which restarts the service in seconds.
      start: ./detector

  - setup: api
    build:
      base: rust@stable
      os: ubuntu
      buildCommands:
        - cargo build --release -p api
      deployFiles: [.]
    run:
      os: ubuntu
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_dbName}
        VALKEY_URL: ${cache_connectionString}
        PORT: 3000
        RUST_LOG: info
      healthCheck:
        httpGet:
          port: 3000
          path: /healthz
      start: ./target/release/api

  - setup: web
    build:
      base: nodejs@22
      envVariables:
        # Baked into the bundle at build time — a static site has no runtime env.
        # If this cross-service ref doesn't resolve, main.ts derives the api
        # origin from its own hostname instead, so the wall connects either way.
        VITE_API_BASE: ${api_zeropsSubdomain}
        # Absolute base for the og:/twitter: tags. Crawlers do not resolve
        # relative image URLs, and Vite substitutes %VITE_SITE_URL% in the HTML
        # at build time, so the social card is correct without a hardcoded host.
        VITE_SITE_URL: ${web_zeropsSubdomain}
      buildCommands:
        - cd web && npm ci
        - cd web && npm run build
      deployFiles: [web/dist/~]
    run:
      base: nginx@1.22
